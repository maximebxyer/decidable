[project]
name = "decidable"
version = "0.1.0"
description = "An evaluation harness for agents whose outputs can be verified by execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decidable"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
