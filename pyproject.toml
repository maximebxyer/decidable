[project]
name = "decidable"
version = "0.1.0"
description = "An evaluation harness for agents whose outputs can be verified by execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxime" }]
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
# The tools the shipped Python verifiers shell out to. Kept optional so the core
# library stays pydantic-only; a missing tool is an honest ERROR, not a crash.
python = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/maximebxyer/decidable"
Repository = "https://github.com/maximebxyer/decidable"
Issues = "https://github.com/maximebxyer/decidable/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decidable"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
